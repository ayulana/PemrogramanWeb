<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container register-wrap py-4 px-3">
  <div class="bg-white rounded-3 shadow-sm p-4">

    <h1 class="display-6">Please Sign Up <small class="text-secondary fs-4">It’s free and always will be.</small></h1>
    <div class="rainbow-bar my-3"></div>

    <form id="registerForm" novalidate>
      <div class="row g-3 mb-3">
        <div class="col-md-6"><input type="text" class="form-control" placeholder="First Name" required></div>
        <div class="col-md-6"><input type="text" class="form-control" placeholder="Last Name" required></div>
      </div>
      <div class="mb-3"><input type="text" class="form-control" placeholder="Display Name" required></div>
      <div class="mb-3"><input type="email" class="form-control" placeholder="Email Address" required></div>
      <div class="row g-3 mb-3">
        <div class="col-md-6"><input type="password" id="pw" class="form-control" placeholder="Password" minlength="6" required></div>
        <div class="col-md-6">
          <input type="password" id="cpw" class="form-control" placeholder="Confirm Password" required>
          <div class="invalid-feedback">Password tidak sama.</div>
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <div class="col-sm-4 col-md-3 mb-2 mb-sm-0">
          <input type="checkbox" class="btn-check" id="agree" required>
          <label class="btn btn-outline-secondary" for="agree">I Agree</label>
        </div>
        <div class="col-sm-8 col-md-9">
          By clicking <span class="badge text-bg-primary">Register</span>, you agree to the
          <a href="#">Terms and Conditions</a> set out by this site, including our Cookie Use.
        </div>
      </div>

      <div class="rainbow-bar mb-3"></div>

      <div class="row g-3">
        <div class="col-md-6 d-grid"><button type="submit" class="btn btn-primary btn-lg">Register</button></div>
        <div class="col-md-6 d-grid"><a href="login.html" class="btn btn-success btn-lg">Sign In</a></div>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const form = document.getElementById('registerForm');
  const pw = document.getElementById('pw'), cpw = document.getElementById('cpw');
  form.addEventListener('submit', e => {
    e.preventDefault();
    cpw.setCustomValidity(pw.value === cpw.value ? '' : 'mismatch');
    form.classList.add('was-validated');
    if (form.checkValidity()) alert('Registrasi berhasil (demo front-end).');
  });
</script>
</body>
</html>
