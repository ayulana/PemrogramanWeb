<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Registrasi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="box">
    <h2>REGISTRATION FORM</h2>
    <form id="formRegistrasi">

      <label for="nama">Nama Mahasiswa:</label>
      <input type="text" id="nama" placeholder="Ketik nama..." autocomplete="off">
      <ul id="saran"></ul>

      <label for="nim">NIM:</label>
      <input type="text" id="nim" placeholder="Masukkan NIM">

      <label for="matkul">Mata Kuliah:</label>
      <select id="matkul">
        <option value="">Pilih Mata Kuliah</option>
        <option>Pemrograman Web</option>
        <option>Basis Data</option>
        <option>Jaringan Komputer</option>
        <option>Kecerdasan Artifisial</option>
      </select>

      <label for="dosen">Dosen:</label>
      <input type="text" id="dosen" placeholder="Masukkan nama dosen">

      <button type="submit">Kirim</button>
      <button type="reset">Reset</button>
    </form>

    <div id="hasil"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
