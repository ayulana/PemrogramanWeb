<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Anggota - LibraryReg</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body data-page="data-anggota"><div id="site-header"></div>
<main class="container py-4">
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"><div><h1 class="fw-bold mb-0">Data Anggota</h1><small class="text-secondary">Petugas: <span id="who"></span></small></div>
<div class="d-flex gap-2"><button class="btn btn-dark" id="btnAdd">+ Tambah Anggota</button><button class="btn btn-outline-dark js-logout">Logout</button></div></div>
<div class="row g-2 mb-3"><div class="col-md-7"><input id="q" class="form-control" placeholder="Cari nama atau NIM/NIP..."></div>
<div class="col-md-3"><select id="f" class="form-select"><option value="">Semua jenis</option><option>Mahasiswa</option><option>Dosen</option><option>Tenaga Kependidikan</option></select></div><div class="col-md-2 d-flex align-items-center text-secondary" id="count"></div></div>
<div class="table-responsive form-card p-0"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>No</th><th>Nama</th><th>NIM/NIP</th><th>Program Studi</th><th>Jenis</th><th class="text-end">Aksi</th></tr></thead><tbody id="tbody"></tbody></table></div>
<div class="modal fade" id="mModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><form class="modal-content" id="mForm" novalidate><div class="modal-header"><h5 class="modal-title" id="mTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body" id="mFields"></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button><button class="btn btn-dark">Simpan</button></div></form></div></div>
<div class="modal fade" id="dModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Detail Anggota</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body" id="dBody"></div></div></div></div>
<div class="modal fade" id="xModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Konfirmasi Hapus</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">Yakin ingin menghapus data <b id="delName"></b>? Tindakan ini tidak dapat dibatalkan.</div><div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button><button class="btn btn-danger" id="btnDel">Ya, Hapus</button></div></div></div></div>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script></body></html>
