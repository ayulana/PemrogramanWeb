<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Petugas - LibraryReg</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body data-page="login"><div id="site-header"></div>
<main class="container py-4">
<div class="row justify-content-center"><div class="col-md-6 col-lg-5"><h1 class="fw-bold">Login Petugas</h1><p class="text-secondary">Khusus petugas perpustakaan.</p>
<form id="loginForm" class="form-card" novalidate>
<div id="loginErr" class="alert alert-danger d-none">Email, nama, atau password salah.</div>
<div class="mb-3"><label class="form-label">Email</label><input name="email" type="email" class="form-control" required><div class="invalid-feedback">Masukkan email yang valid.</div></div>
<div class="mb-3"><label class="form-label">Nama</label><input name="nama" class="form-control" required><div class="invalid-feedback">Masukkan nama.</div></div>
<div class="mb-3"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required><div class="invalid-feedback">Masukkan password.</div></div>
<button class="btn btn-dark w-100">Login</button>
<p class="small text-secondary mt-3 mb-0">Akun demo: petugas@libraryreg.ac.id · Petugas Perpustakaan · admin123</p></form></div></div>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script></body></html>
